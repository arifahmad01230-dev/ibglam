<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ibglam admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF5F1;--surface:#fff;--text:#1B0E16;--muted:#6A5560;--line:#E6D8D2;--gold:#8A5F1A;--accent:#A3234F;--err:#B3261E;--ok:#2E7D4F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#140A10;--surface:#20111A;--text:#F6EBE6;--muted:#BFA7B1;--line:#3A2230;--gold:#D4AE6A;--err:#FF8A80;--ok:#7BD9A0}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:52rem;margin:0 auto;padding:0 1.25rem}
header{border-bottom:1px solid var(--line);padding:1.1rem 0}
.logo{font:700 1.6rem "Bodoni Moda",Georgia,serif;letter-spacing:.04em}
.logo small{display:block;font:700 .7rem "DM Sans",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
h1{font:500 clamp(1.8rem,5vw,2.6rem)/1.1 "Bodoni Moda",Georgia,serif;margin:2rem 0 .5rem}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1.25rem;padding:1.5rem;margin:1.25rem auto}
form.card{max-width:26rem;text-align:left}
label{display:block;font-weight:700;font-size:.9rem;margin:0 0 .3rem}
.f{width:100%;padding:.8rem 1rem;border:1.5px solid var(--line);border-radius:.8rem;background:var(--bg);color:var(--text);font:inherit;margin-bottom:1rem}
.btn{display:inline-block;padding:.75rem 1.4rem;border:0;border-radius:999px;font:700 .95rem "DM Sans",sans-serif;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--gold)}
.btn[disabled]{opacity:.6}
form.card .btn{display:block;margin:.4rem auto 0}
.err{color:var(--err);margin:0 0 1rem}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;align-items:center;margin:1.25rem 0}
.tab[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
select.f{width:auto;margin:0;padding:.6rem 1rem}
.item{text-align:center}
.ref{font:500 1.5rem "Bodoni Moda",serif;color:var(--gold)}
.sum{margin:.5rem 0}
.row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:1rem}
.saved{font-size:.9rem;color:var(--ok);min-height:1.3em;margin:.4rem 0 0}
.badge{display:inline-block;min-width:1.4rem;padding:0 .4rem;border-radius:999px;background:var(--gold);color:var(--bg);font-size:.8rem;margin-left:.3rem}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">ibglam<small>Admin</small></div></div></header>
<main class="wrap">
  <section id="login">
    <h1>Sign in</h1>
    <p class="muted">Use the email and password of your admin account.</p>
    <form class="card" id="lf" novalidate>
      <label for="em">Email</label><input class="f" id="em" type="email" autocomplete="username">
      <label for="pw">Password</label><input class="f" id="pw" type="password" autocomplete="current-password">
      <p class="err" id="le" role="alert" hidden></p>
      <button class="btn" type="submit" id="lb">Sign in</button>
    </form>
  </section>
  <section id="dash" hidden>
    <h1>Orders and bookings</h1>
    <p class="muted" id="count"></p>
    <div class="bar">
      <button class="btn alt tab" id="t-orders" type="button" aria-pressed="true">Orders</button>
      <button class="btn alt tab" id="t-bookings" type="button" aria-pressed="false">Bookings</button>
      <select class="f" id="flt" aria-label="Filter by status"></select>
      <button class="btn alt" id="rf" type="button">Refresh</button>
      <button class="btn alt" id="so" type="button">Sign out</button>
    </div>
    <p class="err" id="de" role="alert" hidden></p>
    <div id="list"></div>
  </section>
</main>
<script>
(function(){
var BASE="https://ebwmfcioneqbuttdblmm.supabase.co",KEY="sb_publishable_7v2BqPBw6CKF3AIpwSPlww_ahIy3erU";
var ST={orders:[["received","Request received"],["confirmed","Confirmed"],["packed","Packed"],["out_for_delivery","Out for delivery"],["delivered","Delivered"],["cancelled","Cancelled"]],
bookings:[["received","Request received"],["confirmed","Confirmed"],["deposit_agreed","Details and deposit agreed"],["completed","Completed"],["cancelled","Cancelled"]]};
var $=function(i){return document.getElementById(i)},token=null,data={orders:[],bookings:[]},tab="orders";
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fmt(d){var x=new Date(d);return isNaN(x)?"":x.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}
function say(id,m){var e=$(id);e.textContent=m;e.hidden=!m}
function api(body){return fetch(BASE+"/functions/v1/ibglam-admin",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+token},body:JSON.stringify(body)})
.then(function(r){return r.json().catch(function(){return{}}).then(function(d){return{ok:r.ok,code:r.status,d:d}})})}
function out(m){token=null;try{sessionStorage.removeItem("ibg_t")}catch(e){}$("dash").hidden=true;$("login").hidden=false;say("le",m||"")}
function load(){say("de","");return api({action:"list"}).then(function(r){
if(r.code===401||r.code===403)return out(r.d.error);
if(!r.ok)return say("de",r.d.error||"Could not load data.");
data=r.d;$("login").hidden=true;$("dash").hidden=false;render()}).catch(function(){say("de","Could not reach the server.")})}
function render(){
var s=ST[tab],f=$("flt"),cur=f.value;f.textContent="";var all=mk("option",0,"All statuses");all.value="";f.appendChild(all);
s.forEach(function(x){var o=mk("option",0,x[1]);o.value=x[0];f.appendChild(o)});f.value=cur&&s.some(function(x){return x[0]===cur})?cur:"";
["orders","bookings"].forEach(function(k){var n=data[k].filter(function(r){return r.status==="received"}).length,b=$("t-"+k);b.textContent=k==="orders"?"Orders":"Bookings";if(n){var g=mk("span","badge",n);b.appendChild(g)}b.setAttribute("aria-pressed",String(k===tab))});
var rows=data[tab].filter(function(r){return!f.value||r.status===f.value});
$("count").textContent=rows.length+" shown, "+data[tab].length+" total";
var L=$("list");L.textContent="";
if(!rows.length)L.appendChild(mk("p","muted","Nothing here yet."));
rows.forEach(function(r){var c=mk("div","card item");c.appendChild(mk("div","ref",r.reference));c.appendChild(mk("div","muted",fmt(r.created_at)));
c.appendChild(mk("p","sum",r.name+" · "+r.phone));
var d=tab==="orders"?[(r.categories||[]).join(", "),r.items,"Deliver to: "+r.address]:[r.service,[r.preferred_date,r.preferred_time].filter(Boolean).join(", "),"Location: "+r.location,r.note?"Look: "+r.note:""];
c.appendChild(mk("p","sum",d.filter(Boolean).join(" | ")));
var row=mk("div","row"),sel=mk("select","f");sel.setAttribute("aria-label","Status for "+r.reference);sel.style.margin="0";
s.forEach(function(x){var o=mk("option",0,x[1]);o.value=x[0];sel.appendChild(o)});sel.value=r.status;
var msg=mk("p","saved");msg.setAttribute("aria-live","polite");
sel.onchange=function(){var prev=r.status,v=sel.value;sel.disabled=true;
api({action:"update",kind:tab==="orders"?"order":"booking",id:r.id,status:v}).then(function(x){
if(x.ok){r.status=v;msg.textContent="Saved. The customer will see this when they track.";render()}
else{sel.value=prev;msg.textContent="";say("de",x.d.error||"Could not save.");if(x.code===401)out(x.d.error)}
}).catch(function(){sel.value=prev;say("de","Could not reach the server.")}).then(function(){sel.disabled=false})};
var wa=mk("a","btn alt","WhatsApp customer");wa.target="_blank";wa.rel="noopener";
wa.href="https://wa.me/234"+r.phone_digits+"?text="+encodeURIComponent("Hello "+r.name+", this is ibglam about your reference "+r.reference+".");
row.appendChild(sel);row.appendChild(wa);c.appendChild(row);c.appendChild(msg);L.appendChild(c)})}
$("lf").addEventListener("submit",function(e){e.preventDefault();say("le","");var em=$("em").value.trim(),pw=$("pw").value;
if(!em||!pw)return say("le","Enter your email and password.");
$("lb").disabled=true;
fetch(BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({email:em,password:pw})})
.then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(r){
if(!r.ok||!r.d.access_token)return say("le","Wrong email or password.");
token=r.d.access_token;try{sessionStorage.setItem("ibg_t",token)}catch(e){}$("pw").value="";return load()})
.catch(function(){say("le","Could not reach the server.")}).then(function(){$("lb").disabled=false})});
$("t-orders").onclick=function(){tab="orders";$("flt").value="";render()};
$("t-bookings").onclick=function(){tab="bookings";$("flt").value="";render()};
$("flt").onchange=render;$("rf").onclick=load;$("so").onclick=function(){out("")};
try{token=sessionStorage.getItem("ibg_t")}catch(e){}
if(token)load();
})();
</script>
</body>
</html>
